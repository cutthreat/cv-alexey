<!doctype html>
<html lang="ru" data-mode="personal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">
  <title>Дежавю · Алексей Саава</title>
  <script>try{const p=new URL(location.href).searchParams;document.documentElement.dataset.mode=p.get('mode')==='team'?'team':'personal';document.documentElement.lang=p.get('lang')==='en'?'en':'ru';}catch(_){}</script>
  <link rel="stylesheet" href="cv-assets/dejavu-styles.db0b57375930.css">
  <script defer src="cv-assets/dejavu-runtime.753e41ee3263.js"></script>
</head>
<body>
<main class="dejavu-game" id="dejavu-game" data-dejavu-game data-mode="personal" data-status="ready" aria-labelledby="dejavu-game-title">
  <div class="dejavu-shell">
    <header class="dejavu-header">
      <a class="dejavu-icon" href="./?cv=1#ru" data-game-back aria-label="Вернуться в CV"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m14 5-7 7 7 7M7 12h14"/></svg></a>
      <div class="dejavu-heading"><h1 id="dejavu-game-title" data-game-title>Дежавю</h1><strong data-game-result></strong></div>
      <div class="dejavu-scores"><output data-game-score>Мыши 0</output><output data-game-best>Рекорд 0</output></div>
    </header>
    <div class="dejavu-play-area">
      <div class="dejavu-stage">
        <canvas data-game-board tabindex="0" role="img" aria-label="Игровое поле: кот, мышь и след из кода"></canvas>
      </div>
      <div class="dejavu-controls" data-game-pad role="group" aria-label="Управление котом">
        <button type="button" class="dejavu-direction" data-game-direction="up" aria-label="Вверх" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 13 7-7 7 7M12 6v13"/></svg></button>
        <button type="button" class="dejavu-direction" data-game-direction="left" aria-label="Влево" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13 5-7 7 7 7M6 12h13"/></svg></button>
        <button type="button" class="dejavu-direction" data-game-direction="right" aria-label="Вправо" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 5 7 7-7 7M18 12H5"/></svg></button>
        <button type="button" class="dejavu-direction" data-game-direction="down" aria-label="Вниз" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 11 7 7 7-7M12 18V5"/></svg></button>
        <div class="dejavu-card" data-game-card><button type="button" class="dejavu-play" data-game-start aria-label="Начать"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button></div>
        <button type="button" class="dejavu-icon" data-game-pause aria-label="Пауза" disabled><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3v14H7zm7 0h3v14h-3z"/></svg></button>
      </div>
    </div>
    <span class="dejavu-sr" data-game-status role="status" aria-live="polite" aria-atomic="true"></span>
  </div>
</main>
  <noscript><p>Для игры нужен JavaScript. <a href="./?cv=1#ru">Вернуться в CV</a></p></noscript>
</body>
</html>
